; PlatformIO project for the M5Stack ATOM Matrix (ESP32) getup firmware.
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
framework = arduino

lib_deps =
    m5stack/M5Atom
    tkjelectronics/Kalman Filter Library
    madhephaestus/ESP32Servo
    fastled/FastLED

monitor_speed = 115200
